<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Колективний результат</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#172e42;font:16px system-ui}main{max-width:1400px;margin:auto;padding:clamp(14px,3vw,42px)}h1{font-size:clamp(28px,4vw,48px);margin:10px 0}nav{display:flex;gap:10px;flex-wrap:wrap}button,a,input{font:inherit;padding:10px 14px;border:1px solid #cbd5df;border-radius:9px;background:white;color:#173e60;text-decoration:none}button,a{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}.lane{padding:16px;border-radius:18px;background:#e8f5e7}.lane:nth-child(2){background:#e5f3fc}.lane:nth-child(3){background:#f1eafb}h2{font-size:22px;margin:0 0 14px}article{background:white;padding:16px;border-radius:12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 6px #173e6010}#status{color:#456;min-height:24px}input{max-width:100%}@media(max-width:760px){.grid{grid-template-columns:1fr}}@media print{nav,input,#status{display:none}.grid{display:block}article{break-inside:avoid}.lane{margin:15px 0}}</style></head><body><main><nav><a href="index.html">← До вправи</a><button id="refresh">Оновити</button><button onclick="window.print()">PDF / друк</button></nav><p>Тема 12 · Зовнішні партнерства</p><h1>Колективна карта партнерства</h1><p>Реальний досвід · Ідеї · Мрії педагогів</p><p id="status" role="status">Завантаження…</p><input id="search" type="search" placeholder="Пошук у відповідях" aria-label="Пошук у відповідях"><div class="grid" id="grid"></div></main><script src="config.js"></script><script>let rows=[],busy=false;const $=id=>document.getElementById(id);function render(){const q=$('search').value.toLocaleLowerCase('uk');$('grid').replaceChildren();for(const [key,label] of [['real','🤝 Реальний досвід'],['idea','💡 Ідеї партнерства'],['dream','✨ Мрії']]){const lane=document.createElement('section');lane.className='lane';const h=document.createElement('h2');const items=rows.map(r=>String(r[key]||'')).filter(x=>x.trim()&&x.toLocaleLowerCase('uk').includes(q));h.textContent=label+' · '+items.length;lane.append(h);for(const x of items){const a=document.createElement('article');a.textContent=x;lane.append(a)}if(!items.length){const p=document.createElement('p');p.textContent='Поки немає відповідей за цим запитом.';lane.append(p)}$('grid').append(lane)}}async function refresh(){if(busy)return;busy=true;try{const u=new URL(window.PARTNER_ENDPOINT);u.searchParams.set('view','collective');u.searchParams.set('_',Date.now());const r=await fetch(u);const d=await r.json();if(!d.ok||!Array.isArray(d.rows))throw Error();rows=d.rows;render();$('status').textContent='Учасників: '+rows.length+' · Оновлено: '+new Date().toLocaleTimeString('uk-UA')}catch(e){$('status').textContent='Не вдалося оновити дошку. Перевірте розгортання Apps Script. Попередні дані залишено.'}finally{busy=false}}$('refresh').onclick=refresh;$('search').oninput=render;render();refresh();setInterval(refresh,15000);</script></body></html>
